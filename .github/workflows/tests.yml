name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install semgrep
        run: pip install "semgrep==1.173.0"

      - name: Validate rule syntax and metadata
        run: make validate SEMGREP=semgrep

      - name: Run annotated rule tests
        run: make test SEMGREP=semgrep
