rules:
  - id: unpooled-jdbc-connection
    pattern-either:
      - pattern: DriverManager.getConnection(...)
      - pattern: java.sql.DriverManager.getConnection(...)
    message: >-
      `DriverManager.getConnection` opens a new physical connection and never
      reuses it. Every call pays TCP, TLS and authentication round trips, and under
      concurrency the replicas together will exhaust the database's
      `max_connections`. Inject a pooled `DataSource` (HikariCP, which Spring Boot
      configures by default) and set `maximumPoolSize` against the database limit
      divided by the expected replica count.
    languages:
      - kotlin
    severity: WARNING
    metadata:
      category: performance
      subcategory:
        - audit
      cloud-antipattern: connection-management
      twelve-factor:
        - iv-backing-services
      technology:
        - kotlin
        - jdbc
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      references:
        - https://github.com/brettwooldridge/HikariCP/wiki/About-Pool-Sizing
      license: MIT
