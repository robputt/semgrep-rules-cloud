rules:
  - id: uncoordinated-scheduled-task
    patterns:
      - pattern: |
          @Scheduled(...)
          fun $METHOD(...) { ... }
      - pattern-not: |
          @SchedulerLock(...)
          @Scheduled(...)
          fun $METHOD(...) { ... }
      - pattern-not: |
          @Scheduled(...)
          @SchedulerLock(...)
          fun $METHOD(...) { ... }
    message: >-
      `@Scheduled` runs inside every replica, so `$METHOD` fires once per instance
      rather than once per interval. For anything that writes, that means duplicate
      work, duplicate emails or double-counted totals as soon as you scale past one
      pod. Guard it with a distributed lock (ShedLock's `@SchedulerLock`) or move the
      trigger to a Kubernetes CronJob or EventBridge schedule that dispatches a
      single execution.
    languages:
      - kotlin
    severity: WARNING
    metadata:
      category: correctness
      subcategory:
        - audit
      cloud-antipattern: scheduling
      twelve-factor:
        - viii-concurrency
        - xii-admin-processes
      technology:
        - kotlin
        - spring
      confidence: MEDIUM
      likelihood: HIGH
      impact: HIGH
      references:
        - https://github.com/lukas-krecan/ShedLock
      license: MIT
