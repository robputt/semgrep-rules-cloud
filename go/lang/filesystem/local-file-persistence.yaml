rules:
  - id: local-file-persistence
    patterns:
      - pattern-either:
          - pattern: os.WriteFile($PATH, ...)
          - pattern: ioutil.WriteFile($PATH, ...)
          - pattern: os.Create($PATH)
          - pattern: os.OpenFile($PATH, ...)
          - pattern: os.MkdirAll($PATH, ...)
          - pattern: os.Mkdir($PATH, ...)
      - metavariable-regex:
          metavariable: $PATH
          regex: ^"(\./|\.\./|/tmp/|/var/tmp/|/data|data/|uploads|reports|logs|cache)
    message: >-
      Writing to the container's local filesystem at $PATH. That disk is not
      shared between replicas and is destroyed when the container is replaced, so
      files written by one pod are missing from the next and anything durable is
      silently lost on deploy. Write to object storage (S3, GCS, Azure Blob) or a
      database; keep local disk for scratch only, and prefer `os.MkdirTemp` when
      you genuinely need temporary space.
    languages:
      - go
    severity: WARNING
    metadata:
      category: portability
      subcategory:
        - audit
      cloud-antipattern: filesystem
      twelve-factor:
        - iv-backing-services
        - vi-processes
      technology:
        - go
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      references:
        - https://12factor.net/processes
      license: MIT
