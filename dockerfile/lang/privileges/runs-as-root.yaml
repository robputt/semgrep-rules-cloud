rules:
  - id: runs-as-root
    patterns:
      - pattern: USER $USER
      - metavariable-regex:
          metavariable: $USER
          regex: ^(root|0|0:0|root:root)$
    message: >-
      `USER $USER` makes root the effective user for everything that follows.
      Under the Kubernetes restricted Pod Security Standard `runAsNonRoot` is
      required, so this image fails admission, and a process escaping the
      container has root on the node. If root is only needed to install packages,
      do that work in a build stage or earlier layer and switch back with a
      numeric UID (`USER 10001`) before `CMD`.
    languages:
      - dockerfile
    severity: ERROR
    metadata:
      category: security
      subcategory:
        - audit
      cwe:
        - "CWE-250: Execution with Unnecessary Privileges"
      cloud-antipattern: privileges
      technology:
        - docker
        - dockerfile
        - kubernetes
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      references:
        - https://kubernetes.io/docs/concepts/security/pod-security-standards/
      license: MIT
