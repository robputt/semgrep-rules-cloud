rules:
  - id: secret-passed-as-build-arg
    patterns:
      - pattern: ARG $NAME
      - pattern-regex: >-
          (?im)^[ \t]*ARG[ \t]+[A-Za-z0-9_]*(SECRET|PASSWORD|PASSWD|TOKEN|API_?KEY|APIKEY|ACCESS_?KEY|PRIVATE_?KEY|CREDENTIAL|SIGNING_?KEY)(?![A-Za-z0-9_]*(FILE|PATH|NAME|ID|URL|URI|ENABLED))[A-Za-z0-9_]*[ \t]*$
    message: >-
      Secret supplied through a build argument. Build args are recorded in image
      metadata, so the value passed with `--build-arg` is readable via
      `docker history` or `docker inspect` by anyone who can pull the image, and it
      is visible in CI logs. Use a BuildKit secret mount instead, which is exposed
      only for the duration of one `RUN` and never written to a layer:
      `RUN --mount=type=secret,id=npm_token npm ci`.
    languages:
      - dockerfile
    severity: ERROR
    metadata:
      category: security
      subcategory:
        - audit
      cwe:
        - "CWE-522: Insufficiently Protected Credentials"
      cloud-antipattern: secrets
      twelve-factor:
        - iii-config
      technology:
        - docker
        - dockerfile
        - buildkit
      confidence: MEDIUM
      likelihood: HIGH
      impact: HIGH
      references:
        - https://docs.docker.com/build/building/secrets/
      license: MIT
