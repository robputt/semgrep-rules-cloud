rules:
  - id: hardcoded-secret-in-image
    # The Dockerfile parser does not expose the ENV/ARG variable name as a
    # metavariable, so match the instruction text directly.
    pattern-regex: >-
      (?im)^[ \t]*(ENV|ARG)[ \t]+[A-Za-z0-9_]*(SECRET|PASSWORD|PASSWD|PWD|TOKEN|API_?KEY|APIKEY|ACCESS_?KEY|PRIVATE_?KEY|CREDENTIAL|SALT|SIGNING_?KEY)(?![A-Za-z0-9_]*(FILE|PATH|NAME|ID|URL|URI|ENABLED))[A-Za-z0-9_]*[ \t]*=[ \t]*["']?[^ \t\r\n"'][^\r\n]*
    message: >-
      Credential baked into an image layer. Layers are immutable and distributed,
      so anyone who can pull the image can read the value with `docker history`,
      and deleting it in a later layer does not remove it. Rotating the credential
      also means rebuilding and redeploying. Inject secrets at runtime from a
      secret manager or the orchestrator (Kubernetes Secret, ECS secrets), and use
      `RUN --mount=type=secret` for anything the build itself needs.
    languages:
      - dockerfile
    severity: ERROR
    metadata:
      category: security
      subcategory:
        - audit
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
      cloud-antipattern: secrets
      twelve-factor:
        - iii-config
      technology:
        - docker
        - dockerfile
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      references:
        - https://docs.docker.com/build/building/secrets/
      license: MIT
