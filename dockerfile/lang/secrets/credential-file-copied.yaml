rules:
  - id: credential-file-copied
    patterns:
      - pattern-either:
          - pattern: COPY $SRC $DST
          - pattern: ADD $SRC $DST
      - metavariable-regex:
          metavariable: $SRC
          regex: (?i)^(.*/)?(\.env(\..+)?|\.netrc|\.npmrc|\.pypirc|\.git-credentials|id_rsa|id_ed25519|id_dsa|.*\.pem|.*\.key|.*\.p12|.*\.pfx|credentials|\.aws|\.aws/.*|\.ssh|\.ssh/.*|service-account.*\.json|gcloud-key.*\.json)$
    message: >-
      Credential file `$SRC` copied into an image layer. It stays readable in the
      layer even if a later instruction deletes it, so anyone able to pull the
      image can extract it, and rotation now requires a rebuild. Add the file to
      `.dockerignore`, inject configuration at runtime from the orchestrator or a
      secret manager, and use `RUN --mount=type=secret` when the build genuinely
      needs the credential.
    languages:
      - dockerfile
    severity: ERROR
    metadata:
      category: security
      subcategory:
        - audit
      cwe:
        - "CWE-538: Insertion of Sensitive Information into Externally-Accessible File or Directory"
      cloud-antipattern: secrets
      twelve-factor:
        - iii-config
      technology:
        - docker
        - dockerfile
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      references:
        - https://docs.docker.com/build/building/secrets/
      license: MIT
