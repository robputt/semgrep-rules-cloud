rules:
  - id: bind-to-localhost
    patterns:
      - pattern-either:
          - pattern: $APP.run(..., host=$HOST, ...)
          - pattern: uvicorn.run(..., host=$HOST, ...)
          - pattern: $SOCKET.bind(($HOST, $PORT))
          - pattern: socketserver.TCPServer(($HOST, $PORT), ...)
          - pattern: http.server.HTTPServer(($HOST, $PORT), ...)
          - pattern: HTTPServer(($HOST, $PORT), ...)
      - metavariable-regex:
          metavariable: $HOST
          regex: ^['"](127\.0\.0\.1|localhost|::1)['"]$
    message: >-
      Server binds to $HOST, which is only reachable from inside the container's
      own network namespace. Kubernetes readiness probes, service traffic and
      load balancer health checks arrive on the pod IP and will be refused.
      Bind to `0.0.0.0` (or `::`) and restrict access with network policy or a
      security group instead.
    languages:
      - python
    severity: ERROR
    metadata:
      category: correctness
      subcategory:
        - audit
      cloud-antipattern: networking
      twelve-factor:
        - vii-port-binding
      technology:
        - python
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      references:
        - https://12factor.net/port-binding
      license: MIT
