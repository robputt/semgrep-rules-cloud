rules:
  - id: hardcoded-secret-fallback
    patterns:
      - pattern-either:
          - pattern: os.getenv($NAME, $DEFAULT)
          - pattern: os.environ.get($NAME, $DEFAULT)
          - pattern: environ.get($NAME, $DEFAULT)
          - pattern: config.get($NAME, $DEFAULT)
          - pattern: $CONFIG.get($NAME, default=$DEFAULT)
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i)['"][a-z0-9_\-\.]*(secret|password|passwd|pwd|token|api_?key|access_?key|private_?key|credential|salt|signing_?key)
      - metavariable-regex:
          metavariable: $DEFAULT
          regex: ^['"].+['"]$
    message: >-
      Secret `$NAME` falls back to the hardcoded literal `$DEFAULT`. The
      fallback ships in the image, so a missing environment variable silently
      starts the app with a known credential instead of failing fast, and the
      value is now in version control. Read the secret with no default
      (`os.environ["..."]`) so misconfiguration is loud, and source it from a
      secret manager or injected environment variable.
    languages:
      - python
    severity: ERROR
    metadata:
      category: security
      subcategory:
        - audit
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
      cloud-antipattern: secrets
      twelve-factor:
        - iii-config
      technology:
        - python
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      references:
        - https://12factor.net/config
      license: MIT
